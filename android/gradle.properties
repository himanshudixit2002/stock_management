org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 full mode: more aggressive whole-program optimization. Default since
# AGP 8, stated explicitly so a toolchain change cannot silently drop it.
android.enableR8.fullMode=true

# Optimized resource shrinking. R8 rewrites the resource table alongside the
# code instead of only blanking unused entries, which is what Play Console's
# "Optimized resource shrinking isn't enabled" recommendation asks for.
android.r8.optimizedResourceShrinking=true
