name: stock_management
description: "Stock Management App - Simple inventory management for everyone"
publish_to: 'none'
version: 1.0.26+30

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # State Management
  provider: ^6.1.2

  # Excel Import/Export
  excel: ^4.0.6
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^0.70.2

  # CSV
  csv: ^6.0.0

  # Utilities
  http: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.3.0
  web: ^1.1.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.4

  # Barcode scanning (Android, iOS, Web)
  mobile_scanner: ^7.2.0

  # PDF generation & printing
  pdf: ^3.11.1
  printing: ^5.13.3
  lottie: ^3.3.0
  connectivity_plus: ^7.1.1
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Virtual clock for timer-based unit tests (Debouncer).
  fake_async: ^1.3.1
  # In-memory Firestore, so the settings write path can be tested for real.
  # Its dotted-key semantics match the SDK's — set() takes a key literally,
  # update() reads it as a field path — which is the whole bug these tests pin.
  fake_cloud_firestore: ^3.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo.png"

flutter:
  uses-material-design: true
  assets:
    # `logo.png` at the repo root is NOT bundled — it is 3.9MB at 2164x2060 and
    # only ever drawn at <=120dp. It stays put purely as the
    # flutter_launcher_icons source below, which reads it at icon-generation
    # time. The app renders assets/images/logo.png via BrandLogo instead.
    - assets/images/logo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/lottie/

  # Inter, bundled rather than fetched at runtime: the app previously set no
  # fontFamily at all and rendered in whatever the platform defaulted to — the
  # CanvasKit fallback on web. Bundling means no network dependency and no flash
  # of fallback text, and the app looks identical on every platform.
  #
  # NotoSans above is NOT a UI font — it is loaded by rootBundle in the PDF
  # services and never reaches the widget tree.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700