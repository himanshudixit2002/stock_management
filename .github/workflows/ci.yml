# CI for both halves of the product: the Flutter client and the Python agent.
#
# Two things here are not boilerplate and are worth reading before editing.
#
# `lib/firebase_options.dart` is gitignored, so a checkout has no Firebase
# config and cannot even be analyzed — `main.dart` imports it. Every Flutter job
# therefore copies the placeholder into place first. The placeholder is not a
# secret and reaches no live project; the unit tests do not touch the network.
#
# OFFLINE_MODE is never set at the job level. `Principal.has` short-circuits to
# True when it is set, which would turn every permission assertion in the auth
# suite into a tautology and report five green ticks for an agent that lets a
# viewer write. The test files that need the offline store set it themselves.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing, and holding a runner for it costs money.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.7"
  PYTHON_VERSION: "3.12"

jobs:
  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Provide Firebase config
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get

      # `dart format --set-exit-if-changed` is deliberately absent. This repo is
      # not formatter-clean, and turning that into a gate would rewrite most of
      # the tree in one unreviewable commit. Analysis catches what matters.
      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --reporter github --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: Agent backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: rag_backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Runs both test conventions in this repo — pytest modules and the
      # script-style files that assert at import and exit non-zero — and fails
      # if either does. Running plain `pytest` here would collect the four
      # pytest files, silently skip the other fourteen, and report success.
      - name: Test
        run: python run_tests.py

  evals:
    name: Agent evals — quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: rag_backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No API key, no tokens, no network: the read path answers from the fact
      # layer and the write path replays a scripted model. The coverage gate is
      # the cost regression check — if a question that used to be answered for
      # free starts reaching the model, this fails and someone has to say why.
      - name: Grade the agent
        run: |
          python run_evals.py \
            --json eval-report.json \
            --min-pass-rate 100 \
            --min-deterministic-coverage 70

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: rag_backend/eval-report.json
          if-no-files-found: ignore

  contract:
    name: API contract — schema & client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: rag_backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_backend/requirements.txt

      # The chain is: FastAPI app -> openapi.json -> generated Dart models. Both
      # generated artefacts are committed, and both are regenerated here and
      # compared. A field renamed in a Pydantic model without regenerating shows
      # up as a red check rather than as a null on someone's phone six weeks
      # later.
      - name: Schema is current
        working-directory: rag_backend
        run: python tools/export_openapi.py --check

      - name: Generated Dart client is current
        working-directory: rag_backend
        run: python tools/generate_client.py --check

  reporting:
    name: Reporting service — tests on real PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting_service

    # The suite runs on H2 in PostgreSQL mode locally, so it needs nothing
    # installed. Here it runs a second time against the real engine. The SQL is
    # written to be portable precisely so these two agree; if they ever stop
    # agreeing, a query has started depending on a dialect.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reporting_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Pass one: H2, exactly as a developer runs it.
      - name: Test (H2, PostgreSQL mode)
        run: mvn -B test

      # Pass two: the same tests, the same migration, a real PostgreSQL.
      - name: Test (PostgreSQL)
        run: >-
          mvn -B test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/reporting_test
          -Dspring.datasource.username=postgres
          -Dspring.datasource.password=postgres
          -Dspring.datasource.driver-class-name=org.postgresql.Driver

      - name: Package
        run: mvn -B package -DskipTests

  security:
    name: Security — dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r rag_backend/requirements.txt --strict
        # Advisories appear against pinned-elsewhere transitive deps regularly.
        # Reported, not blocking, so a new CVE in a library does not stop an
        # unrelated fix from shipping — triage belongs to a person.
        continue-on-error: true

      - name: Audit Node dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions
        continue-on-error: true

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Agent image — build & scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: CI proves the image assembles, and deployment is a
      # separate, credentialed step rather than a side effect of a green check.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: rag_backend
          push: false
          load: true
          tags: inventory-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the reporting image
        uses: docker/build-push-action@v6
        with:
          context: reporting_service
          push: false
          load: true
          tags: reporting-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: inventory-agent:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Report findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
