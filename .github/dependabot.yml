# Dependency updates, batched so the noise stays reviewable.
#
# Grouped on purpose: ungrouped Dependabot on four ecosystems opens a dozen PRs
# a week, they get rubber-stamped or ignored, and the security updates get lost
# among the patch bumps. Security advisories still arrive as their own PRs.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /rag_backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The agent runtime moves fast and its packages move together; a langchain
      # bump that lands without langgraph is usually broken.
      agent-runtime:
        patterns: ["langchain*", "langgraph*"]
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      firebase:
        patterns: ["firebase*"]

  - package-ecosystem: maven
    directory: /reporting_service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Spring's modules are released together and a partial bump is usually
      # broken; the parent POM manages the versions, so they move as one.
      spring:
        patterns: ["org.springframework*", "org.springframework.boot*"]
      java-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Boot 3 -> 4 is a framework migration, not a version bump: autoconfigure
      # was split into per-domain modules, and Hibernate now validates the schema
      # before Flyway migrates it, so the context will not start. Investigated and
      # closed in #2. Left to Dependabot it reopens weekly and holds CI red for a
      # change nobody is ready to make.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  # The workflows pin action versions; without this they silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
