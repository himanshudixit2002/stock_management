# The shapes of inventory that produce a confidently wrong answer.
#
# An empty workspace and a workspace whose only product is at zero both reduce
# to "nothing to sell", and an assistant that conflates them tells a new user
# their catalog is out of stock. They are different sentences and this suite
# keeps them different.
cases:
  - id: empty_catalog_is_not_out_of_stock
    question: "show me low stock items"
    catalog: empty
    expect:
      items_are_real_products: true
      grounded_numbers: true
      no_writes: true
      max_llm_calls: 0

  - id: empty_catalog_valuation_is_zero_not_invented
    question: "what is my total inventory value"
    catalog: empty
    expect:
      grounded_numbers: true
      no_writes: true
      max_llm_calls: 0
      decoy_products: ["Fresh Apples", "Pro Laptops"]

  - id: a_zero_stock_product_is_reported_out
    question: "which products are out of stock"
    catalog: single_out_of_stock
    expect:
      items_are_real_products: true
      grounded_numbers: true
      max_llm_calls: 0
      must_contain: ["Discontinued Gadget"]

  - id: single_product_valuation_is_zero_at_zero_stock
    # One product, zero units: the catalog is not empty but the stock is worth
    # nothing. Quoting the unit price as the inventory value is the trap.
    question: "what is my total inventory value"
    catalog: single_out_of_stock
    expect:
      grounded_numbers: true
      max_llm_calls: 0
